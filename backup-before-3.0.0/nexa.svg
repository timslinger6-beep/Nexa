<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#00dfd8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="reflexGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <g transform="translate(0, -30)">
    <g filter="url(#neonGlow)">
      <path d="M 310,220 L 310,480 L 410,380 Z" fill="url(#coreGrad)"/>
      <path d="M 490,480 L 490,220 L 390,320 Z" fill="url(#coreGrad)"/>
    </g>

    <g filter="url(#dropShadow)">
      <path d="M 260,250 L 400,160 L 540,250 L 540,450 L 400,540 L 260,450 Z"
            fill="url(#glassBody)"
            stroke="url(#glassEdge)"
            stroke-width="3"
            stroke-linejoin="round"/>

      <path d="M 260,250 L 400,350 L 540,250"
            fill="none"
            stroke="url(#glassEdge)"
            stroke-width="1.5"
            opacity="0.7"/>

      <path d="M 400,350 L 400,540"
            fill="none"
            stroke="url(#glassEdge)"
            stroke-width="1.5"
            opacity="0.7"/>

      <path d="M 260,450 L 400,350 L 540,450"
            fill="none"
            stroke="url(#glassEdge)"
            stroke-width="1.5"
            opacity="0.4"/>
    </g>

    <path d="M 262,252 L 400,163 L 538,252 L 400,348 Z"
          fill="url(#reflexGrad)"/>
  </g>

  <text x="400" y="640"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="12"
        fill="#ffffff"
        text-anchor="middle">NEXA</text>

  <text x="400" y="680"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="14"
        font-weight="500"
        letter-spacing="8"
        fill="#00dfd8"
        opacity="0.8"
        text-anchor="middle">CORE ENGINE</text>
</svg>

